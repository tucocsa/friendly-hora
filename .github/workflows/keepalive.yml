name: keepalive

# GitHub вимикає розклад у публічному репозиторії після 60 днів без активності.
# Порожні коміти від бота не робимо (схоже на обхід правил GitHub): лише нагадуємо в Telegram.
on:
  schedule:
    # Щодня о 07:17 UTC — 10:17 влітку, 09:17 взимку за Києвом.
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/keepalive.js'
      - 'src/message.js'
      - 'src/telegram.js'
      - '.github/workflows/keepalive.yml'

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Уся історія, щоб знайти останній коміт людини; вміст старих файлів не потрібен.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node src/keepalive.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
